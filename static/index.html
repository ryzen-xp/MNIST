<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digit Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-5 py-12">
      <section class="w-full rounded-3xl border border-slate-800 bg-slate-900 p-7 shadow-2xl sm:p-10">
        <div class="mb-8">
          <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-indigo-300">Burn · MNIST</p>
          <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Handwritten digit classifier</h1>
          <p class="mt-3 max-w-xl leading-7 text-slate-400">
            Upload one or more images containing handwritten digits. The model works best with a
            single, centered digit on a plain background.
          </p>
        </div>

        <form id="upload-form" class="space-y-5">
          <label
            for="images"
            class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-700 bg-slate-950/60 px-6 py-10 text-center transition hover:border-indigo-400"
          >
            <span class="mb-2 text-lg font-semibold">Choose image files</span>
            <span class="text-sm text-slate-400">PNG or JPEG · Up to 10 MiB per image, 20 MiB per upload</span>
            <input
              id="images"
              name="images"
              type="file"
              accept="image/png,image/jpeg"
              multiple
              required
              class="mt-5 block w-full max-w-xs text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-indigo-500 file:px-4 file:py-2 file:font-semibold file:text-white hover:file:bg-indigo-400"
            />
          </label>

          <button
            id="submit-button"
            type="submit"
            class="w-full rounded-xl bg-indigo-500 px-5 py-3 font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-wait disabled:opacity-60"
          >
            Predict digits
          </button>
        </form>

        <p id="status" role="status" aria-live="polite" class="mt-5 text-sm text-slate-400"></p>
        <ul id="results" class="mt-4 space-y-3"></ul>
      </section>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const button = document.querySelector("#submit-button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        results.replaceChildren();
        status.className = "mt-5 text-sm text-slate-400";
        status.textContent = "Classifying images…";
        button.disabled = true;

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: new FormData(form),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Prediction failed.");
          }

          for (const prediction of payload) {
            const row = document.createElement("li");
            row.className =
              "flex items-center justify-between gap-4 rounded-xl border border-slate-800 bg-slate-950 px-4 py-3";
            const filename = document.createElement("span");
            filename.className = "truncate text-slate-300";
            filename.textContent = prediction.filename;
            const digit = document.createElement("span");
            digit.className = "shrink-0 rounded-lg bg-indigo-500/15 px-3 py-1 text-xl font-bold text-indigo-300";
            digit.textContent = prediction.digit;
            row.append(filename, digit);
            results.append(row);
          }
          status.textContent = `Finished: ${payload.length} image${payload.length === 1 ? "" : "s"} classified.`;
        } catch (error) {
          status.textContent = error.message;
          status.className = "mt-5 text-sm text-rose-300";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
